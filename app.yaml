runtime: python312

entrypoint: gunicorn -k uvicorn.workers.UvicornWorker -b :$PORT -w 2 --timeout 120 app.main:app

# NOTE: deliberately no `app_engine_apis: true`. The app uses only standalone
# Google Cloud client libraries so that a move to Cloud Run stays possible.

env_variables:
  TZ: UTC

instance_class: F1

automatic_scaling:
  min_instances: 0
  max_instances: 4

handlers:
- url: /robots\.txt
  static_files: static/robots.txt
  upload: static/robots\.txt

- url: /landing
  static_files: templates/landing.html
  upload: templates/landing.html
  mime_type: text/html

- url: /android/beta
  static_files: templates/android_beta.html
  upload: templates/android_beta.html
  mime_type: text/html

- url: /android/new/beta
  static_files: templates/android_new_beta.html
  upload: templates/android_new_beta.html
  mime_type: text/html

- url: /favicon\.ico
  static_files: favicon.ico
  upload: favicon\.ico

- url: /assets
  static_dir: assets

- url: /tos
  static_dir: tos

- url: /.*
  script: auto
  secure: optional
