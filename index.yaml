indexes:

# Kept from the python27 app -- kind, property names and directions must stay
# identical because the old version keeps reading the same data during the
# traffic split.

# GenerateDictionary: deleted == False, lang == <lang>, ordered by E
- kind: GlobalDictionaryWord
  properties:
  - name: deleted
  - name: lang
  - name: E

# app.web._word_shape: the statistics pages' one index-only pass over the
# dictionary. Every property the projection asks for has to be in here, and
# a word missing any of them drops out of the result -- all six carry
# defaults, so every word that has ever been put() has all six.
- kind: GlobalDictionaryWord
  properties:
  - name: E
  - name: D
  - name: used_times
  - name: failed_times
  - name: guessed_times
  - name: total_explanation_time

# UserDictionaryHandler.get: owner IN (...), version > N
- kind: UserDictionaryWord
  properties:
  - name: owner
  - name: version

# _get_max_version: owner IN (...), ordered by -version
- kind: UserDictionaryWord
  properties:
  - name: owner
  - name: version
    direction: desc
